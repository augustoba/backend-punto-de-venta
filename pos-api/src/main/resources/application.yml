server:
  port: ${PORT:8081}

spring:
  application:
    name: pos-api
  datasource:
    # Base propia del punto de venta (NO es la del ecommerce). Las tablas de esta API llevan prefijo pos_.
    url: jdbc:mysql://localhost:3306/puntoventa?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

pos:
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  auth:
    enabled: ${AUTH_ENABLED:true}
    # Cambiar en producción (variable AUTH_SECRET): firma los tokens de sesión.
    secret: ${AUTH_SECRET:dev-secret-cambiar-en-produccion-0123456789}
    ttl-hours: 12
    # Contraseña del usuario `admin` que se crea al primer arranque (cambiala desde la app).
    initial-password: ${ADMIN_PASSWORD:admin}
